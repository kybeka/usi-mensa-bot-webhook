name: Send 1908 menu
run-name: Send 1908 menu (${{ github.event_name == 'schedule' && 'live' || inputs.delivery_mode }})

on:
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: Delivery mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
  schedule:
    # Avoid minute 00, when GitHub Actions has its highest scheduled-workflow load.
    - cron: '17 7 * * 1-5'
      timezone: Europe/Zurich

permissions:
  actions: read
  contents: read

concurrency:
  group: send-1908-menu
  cancel-in-progress: false

jobs:
  send-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.delivery_mode }}
      TIMEZONE: Europe/Zurich
      SEND_HOUR_LOCAL: 6
      SEND_WINDOW_HOURS: 12
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Refuse live delivery from a non-default branch
        if: env.DELIVERY_MODE == 'live' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Live delivery is allowed only from the default branch."
          exit 1

      - name: Determine the Zurich delivery date
        if: env.DELIVERY_MODE == 'live'
        id: delivery-date
        run: |
          delivery_date="$(TZ="$TIMEZONE" date +%Y-%m-%d)"
          week_key="$(TZ="$TIMEZONE" date -d "$delivery_date" +%G-W%V)"
          echo "date=$delivery_date" >> "$GITHUB_OUTPUT"
          echo "week_key=$week_key" >> "$GITHUB_OUTPUT"
          echo "lock_name=menu-delivery-$delivery_date" >> "$GITHUB_OUTPUT"

      - name: Restore the newest current-week menu snapshot
        if: env.DELIVERY_MODE == 'live'
        id: menu-snapshot-cache
        uses: actions/cache/restore@v6
        with:
          path: menu-cache
          key: menu-snapshot-${{ steps.delivery-date.outputs.week_key }}-${{ steps.delivery-date.outputs.date }}
          restore-keys: |
            menu-snapshot-${{ steps.delivery-date.outputs.week_key }}-

      - name: Prepare the current-week menu snapshot
        if: env.DELIVERY_MODE == 'live'
        env:
          DELIVERY_DATE: ${{ steps.delivery-date.outputs.date }}
          MENU_SNAPSHOT_PATH: menu-cache/current-week.html
        run: python -m mensa_bot.snapshot

      - name: Validate the live payload before acquiring the lock
        if: github.event_name == 'schedule' || inputs.delivery_mode == 'live'
        env:
          DELIVERY_MODE: dry-run
          MENU_SNAPSHOT_PATH: menu-cache/current-week.html
        run: python channel_job.py

      - name: Save the current-week menu snapshot
        if: env.DELIVERY_MODE == 'live' && steps.menu-snapshot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: menu-cache
          key: menu-snapshot-${{ steps.delivery-date.outputs.week_key }}-${{ steps.delivery-date.outputs.date }}

      - name: Check the per-day delivery lock
        if: env.DELIVERY_MODE == 'live'
        env:
          DELIVERY_DATE: ${{ steps.delivery-date.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: python -m mensa_bot.delivery_lock

      - name: Create the per-day delivery marker
        if: env.DELIVERY_MODE == 'live'
        run: |
          mkdir -p delivery-lock-state
          printf 'date=%s\nrun_id=%s\n' \
            '${{ steps.delivery-date.outputs.date }}' \
            "$GITHUB_RUN_ID" > delivery-lock-state/attempt.txt

      - name: Acquire the per-day delivery lock
        if: env.DELIVERY_MODE == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery-date.outputs.lock_name }}
          path: delivery-lock-state/attempt.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Send channel menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENU_SNAPSHOT_PATH: ${{ (github.event_name == 'schedule' || inputs.delivery_mode == 'live') && 'menu-cache/current-week.html' || '' }}
        run: python channel_job.py
