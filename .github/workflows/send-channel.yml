name: Send 1908 menu

on:
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: Delivery mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
  schedule:
    # 05:00 UTC = 07:00 CEST / 06:00 CET; scheduled early to absorb GitHub's
    # typical 3-4 h delay and still land before noon Zurich time.
    - cron: '0 5 * * 1-5'

jobs:
  send-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Send channel menu
        env:
          DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.delivery_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEZONE: Europe/Zurich
          SEND_HOUR_LOCAL: 7
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python channel_job.py
